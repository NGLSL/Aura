[workspace]
resolver = "2"
members = [
    "crates/envbox-core",
    "crates/envbox-storage",
    "crates/envbox-launcher",
    "crates/envbox-broker",
    "crates/envbox-cli",
    "crates/envbox-app",
    "tools/envbox-probe",
    "tools/envbox-browser-probe",
    "tools/envbox-suspended-helper",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/example/envbox"

[workspace.dependencies]
envbox-core = { path = "crates/envbox-core" }
envbox-storage = { path = "crates/envbox-storage" }
envbox-launcher = { path = "crates/envbox-launcher" }
envbox-broker = { path = "crates/envbox-broker" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_IO",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_Time",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_System_Environment",
    "Win32_System_Registry",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }
image = "0.24"
