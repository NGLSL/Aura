[package]
name = "envbox-app"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "envbox-app"
path = "src/main.rs"

[dependencies]
envbox-core = { workspace = true }
envbox-storage = { workspace = true }
envbox-launcher = { workspace = true }
uuid = { workspace = true }
iced = { version = "0.13", features = ["tokio", "image", "svg", "advanced"] }
iced_graphics = "0.13"
image = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows = { workspace = true }
tray-icon = { version = "0.24.2", default-features = false }

[build-dependencies]
winres = "0.1"
