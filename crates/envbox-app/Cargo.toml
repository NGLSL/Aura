[package]
name = "envbox-app"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "envbox-app"
path = "src/main.rs"

[dependencies]
envbox-core = { workspace = true }
envbox-storage = { workspace = true }
envbox-launcher = { workspace = true }
uuid = { workspace = true }
# CPU rendering avoids the GPU backend's device and driver overhead for this UI.
# Keep the existing font/theme defaults while selecting only tiny-skia.
iced = { version = "0.13", default-features = false, features = ["tiny-skia", "tokio", "image", "svg", "advanced", "fira-sans", "auto-detect-theme"] }
iced_graphics = "0.13"
image = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows = { workspace = true }
tray-icon = { version = "0.24.2", default-features = false }

[build-dependencies]
winres = "0.1"
