name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    name: Build and publish Aura installer
    runs-on: windows-2022
    timeout-minutes: 120
    permissions:
      actions: read
      contents: write
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out Aura
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install Rust 1.99.0
        run: |
          rustup toolchain install 1.99.0-x86_64-pc-windows-msvc --profile minimal
          rustup default 1.99.0-x86_64-pc-windows-msvc

      - name: Validate release tag and source version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Release tag must have the form v<major>.<minor>.<patch>; got $tag"
          }

          $metadataJson = & cargo metadata --locked --no-deps --format-version 1
          if ($LASTEXITCODE -ne 0) { throw "cargo metadata failed ($LASTEXITCODE)" }
          $metadata = ($metadataJson -join "`n") | ConvertFrom-Json
          $appPackages = @($metadata.packages | Where-Object { $_.name -eq 'envbox-app' })
          if ($appPackages.Count -ne 1) {
            throw "expected exactly one envbox-app package in Cargo metadata"
          }
          $expectedTag = "v$($appPackages[0].version)"
          if ($tag -ne $expectedTag) {
            throw "release tag $tag does not match envbox-app Cargo version $($appPackages[0].version); expected $expectedTag"
          }

          git fetch origin main --no-tags --force
          $tagCommit = (git rev-list -n 1 $env:GITHUB_REF).Trim()
          if ($LASTEXITCODE -ne 0 -or -not $tagCommit) {
            throw "could not resolve commit for $env:GITHUB_REF"
          }
          $mainCommit = (git rev-parse origin/main).Trim()
          if ($LASTEXITCODE -ne 0 -or -not $mainCommit) {
            throw 'could not resolve origin/main'
          }
          git merge-base --is-ancestor $tagCommit $mainCommit
          if ($LASTEXITCODE -ne 0) {
            throw "release tag $tag points to $tagCommit, which is not contained in origin/main ($mainCommit)"
          }

          $notePath = Join-Path $env:GITHUB_WORKSPACE "docs\releases\$tag.md"
          if (-not (Test-Path -LiteralPath $notePath -PathType Leaf)) {
            throw "release note is required: $notePath"
          }

          "AURA_RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "AURA_TAG_COMMIT=$tagCommit" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify successful CI for the tagged main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = $env:GITHUB_REPOSITORY
          $sha = $env:AURA_TAG_COMMIT
          $uri = "https://api.github.com/repos/$repo/actions/workflows/ci.yml/runs?head_sha=$sha&per_page=100"
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          try {
            $runs = Invoke-RestMethod -Headers $headers -Uri $uri
          } catch {
            throw "failed to query ci.yml runs for $sha : $_"
          }

          $successfulRun = @($runs.workflow_runs | Where-Object {
            $_.head_sha -eq $sha -and
            $_.event -eq 'push' -and
            $_.head_branch -eq 'main' -and
            $_.status -eq 'completed' -and
            $_.conclusion -eq 'success'
          } | Select-Object -First 1)
          if ($successfulRun.Count -lt 1) {
            throw "tagged commit $sha has no successful ci.yml run from a push to main"
          }
          Write-Host "Using successful CI run $($successfulRun[0].html_url)"

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@v2

      - name: Check out Microsoft Detours
        uses: actions/checkout@v4
        with:
          repository: microsoft/Detours
          ref: adb07604aa56508448b95bf037c2a6d0d3b6831a
          path: third_party/Detours
          persist-credentials: false

      - name: Restore Detours libraries
        id: detours-cache
        uses: actions/cache@v4
        with:
          path: |
            third_party/Detours/lib.X64
            third_party/Detours/lib.X86
            third_party/Detours/include
          key: detours-windows-2022-adb07604aa56508448b95bf037c2a6d0d3b6831a

      - name: Build Microsoft Detours for x64 and x86
        env:
          DETOURS_CACHE_HIT: ${{ steps.detours-cache.outputs.cache-hit }}
        run: |
          $ErrorActionPreference = 'Stop'
          $detours = Join-Path $env:GITHUB_WORKSPACE 'third_party\Detours'
          $revision = (git -C $detours rev-parse HEAD).Trim()
          if ($revision -ne 'adb07604aa56508448b95bf037c2a6d0d3b6831a') {
            throw "Unexpected Detours revision: $revision"
          }

          if ($env:DETOURS_CACHE_HIT -ne 'true') {
            $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
            $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
            if (-not $vs) { throw 'Visual Studio C++ tools not found' }
            $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvarsall.bat'
            Push-Location (Join-Path $detours 'src')
            try {
              foreach ($arch in @('x64', 'x86')) {
                $target = $arch.ToUpperInvariant()
                $command = "call `"$vcvars`" $arch >nul && set `"DETOURS_TARGET_PROCESSOR=$target`" && nmake /nologo"
                & cmd.exe /d /s /c $command
                if ($LASTEXITCODE -ne 0) { throw "Detours $arch build failed ($LASTEXITCODE)" }
              }
            } finally {
              Pop-Location
            }
          }

          if (-not (Test-Path -LiteralPath (Join-Path $detours 'include\detours.h'))) {
            throw 'Detours header missing'
          }
          foreach ($target in @('X64', 'X86')) {
            if (-not (Test-Path -LiteralPath (Join-Path $detours "lib.$target\detours.lib"))) {
              throw "Detours $target library missing"
            }
          }
          "DETOURS_ROOT=$detours" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Aura installer
        run: |
          .\scripts\build-installer.ps1
          if (-not (Test-Path -LiteralPath artifacts\envbox-supervisor.exe -PathType Leaf)) {
            throw 'Supervisor backend missing from staged installer artifacts'
          }

      - name: Write installer checksum and release body
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:GITHUB_WORKSPACE 'artifacts\aura-setup.exe'
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) {
            throw "installer not found: $installer"
          }
          $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          $size = (Get-Item -LiteralPath $installer).Length
          Set-Content -LiteralPath "$installer.sha256" -Value "$hash  aura-setup.exe" -Encoding ascii

          $notePath = Join-Path $env:GITHUB_WORKSPACE "docs\releases\$env:AURA_RELEASE_TAG.md"
          $note = Get-Content -LiteralPath $notePath -Raw
          $body = @(
            $note.TrimEnd()
            ''
            '## Installer'
            ''
            '- File: aura-setup.exe'
            "- Size: $size bytes"
            "- SHA-256: $hash"
          ) -join "`n"
          Set-Content -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'release-body.md') -Value $body -Encoding utf8
          Write-Host "Installer size: $size bytes"
          Write-Host "Installer SHA-256: $hash"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          body_path: release-body.md
          files: |
            artifacts/aura-setup.exe
            artifacts/aura-setup.exe.sha256
